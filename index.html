<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>América - Capitales e IATA</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172033}header{padding:10px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}header b{font-size:16px}.wrap{display:grid;grid-template-columns:1fr 320px;gap:10px;padding:10px}.box{background:#fff;border:1px solid #dfe5ec;border-radius:16px;overflow:hidden}.head{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.head p{margin:2px 0;font-size:11px;color:#667085}.btn{padding:8px 11px;border:1px solid #dfe5ec;border-radius:9px;background:#fff;font-weight:700}.primary{background:#0f172a;color:white}#map{height:calc(100vh - 130px);min-height:500px;background:#b9def2}.tray{padding:10px;max-height:calc(100vh - 75px);overflow:auto}.cards{display:grid;gap:7px}.card{padding:9px;border:1px solid #dfe5ec;border-radius:10px;background:#fff;cursor:grab;touch-action:none;user-select:none}.card.placed{opacity:.35}.card b{font-size:12px}.card small{display:block;color:#667085}.ghost{position:fixed;z-index:9999;pointer-events:none;width:170px;transform:translate(-50%,-50%);box-shadow:0 8px 30px #0003}.country{background:#ffffffdd;border:0;font-weight:800;font-size:8px;padding:2px 3px}.country:before,.placedTag:before{display:none}.placedTag{background:white;border:1px solid #bbb;border-radius:6px;font-size:8px;font-weight:800;padding:3px 5px}.ok{background:#dcfce7!important;border-color:#22c55e!important}.bad{background:#fee2e2!important;border-color:#ef4444!important}.stats{font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10000;place-items:center;padding:20px}.modal.show{display:grid}.modal>div{background:#fff;padding:20px;border-radius:16px;max-width:400px;width:100%}.big{font-size:38px;font-weight:900}
@media(max-width:800px){.wrap{display:block;padding:6px}#map{height:55vh;min-height:360px}.tray{margin-top:7px;max-height:none}.cards{display:flex;overflow-x:auto}.card{min-width:145px}.country{font-size:6px}header{padding:8px}}

    height:46px;padding:5px 8px;

.trayNav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.navBtns{display:flex;align-items:center;gap:5px}

@media(max-width:800px){
 .trayNav{height:27px}

 /* En móvil el dedo queda reservado para arrastrar las tarjetas. */

}

</style></head><body>
<header><div><b>🌎 América: 30 de la guía</b><div style="font-size:10px;color:#667085">30 elementos exactos · capitales + IATA</div></div><div class="stats"><b id="count">0</b>/60 colocadas</div></header>
<div class="wrap"><section class="box"><div class="head"><div><b>Mapa de América</b><p>Los países están identificados. Puedes mover tus respuestas hasta pulsar Corregir.</p></div><div><button class="btn" id="clear">Limpiar</button> <button class="btn primary" id="check">Corregir</button></div></div><div id="map"></div></section>
<aside class="box tray">
      <div class="trayNav">
        <b>📚 Listado completo</b>
        <div class="navBtns">
          <button class="navBtn" id="prevCards" aria-label="Ver tarjetas anteriores">◀</button>
          <span id="cardPage">1</span>
          <button class="navBtn" id="nextCards" aria-label="Ver tarjetas siguientes">▶</button>
        </div>
      </div>
      <p style="font-size:11px;color:#667085">🏛️ Capitales y ✈️ códigos IATA</p>
      <div class="cards" id="cards"></div>
    </aside></div>
<div class="modal" id="modal"><div><b>Resultado final</b><div class="big" id="result"></div><p id="detail"></p><button class="btn" onclick="modal.classList.remove('show')">Revisar mapa</button> <button class="btn primary" onclick="reset()">Intentar de nuevo</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script>
const C=[{"mapName": "Alaska", "name": "Alaska", "capital": "Juneau", "iata": "JNU", "iso2": "AK", "color": "#3695c7"}, {"mapName": "Canada", "name": "Canadá", "capital": "Ottawa", "iata": "YOW", "iso2": "CA", "color": "#c64f70"}, {"mapName": "United States of America", "name": "Estados Unidos", "capital": "Washington D. C.", "iata": "DCA", "iso2": "US", "color": "#3695c7"}, {"mapName": "Mexico", "name": "México", "capital": "Ciudad de México", "iata": "MEX", "iso2": "MX", "color": "#31945b"}, {"mapName": "Honduras", "name": "Honduras", "capital": "Tegucigalpa", "iata": "TGU", "iso2": "HN", "color": "#efb04e"}, {"mapName": "Guatemala", "name": "Guatemala", "capital": "Ciudad de Guatemala", "iata": "GUA", "iso2": "GT", "color": "#d45c78"}, {"mapName": "El Salvador", "name": "El Salvador", "capital": "San Salvador", "iata": "SAL", "iso2": "SV", "color": "#82b84b"}, {"mapName": "Nicaragua", "name": "Nicaragua", "capital": "Managua", "iata": "MGA", "iso2": "NI", "color": "#ecd75c"}, {"mapName": "Costa Rica", "name": "Costa Rica", "capital": "San José", "iata": "SJO", "iso2": "CR", "color": "#ef8652"}, {"mapName": "Colombia", "name": "Colombia", "capital": "Bogotá", "iata": "BOG", "iso2": "CO", "color": "#55a7d4"}, {"mapName": "Panama", "name": "Panamá", "capital": "Ciudad de Panamá", "iata": "PTY", "iso2": "PA", "color": "#d86b54"}, {"mapName": "Ecuador", "name": "Ecuador", "capital": "Quito", "iata": "UIO", "iso2": "EC", "color": "#b8b34a"}, {"mapName": "Peru", "name": "Perú", "capital": "Lima", "iata": "LIM", "iso2": "PE", "color": "#d6bc72"}, {"mapName": "Bolivia", "name": "Bolivia", "capital": "Sucre", "iata": "SRE", "iso2": "BO", "color": "#73b9d8"}, {"mapName": "Chile", "name": "Chile", "capital": "Santiago", "iata": "SCL", "iso2": "CL", "color": "#c94768"}, {"mapName": "Greenland", "name": "Groenlandia", "capital": "Nuuk", "iata": "GOH", "iso2": "GL", "color": "#e9eee8"}, {"mapName": "Cuba", "name": "Cuba", "capital": "La Habana", "iata": "HAV", "iso2": "CU", "co const cards=[];C.forEach(c=>{cards.push({id:c.iso2+"c",iso:c.iso2,k:"capital",t:c.capital});cards.push({id:c.iso2+"i",iso:c.iso2,k:"iata",t:c.iata})});
let layers={},places={},marks={},drag=null,done=false;

const SPECIAL={
 "AK":[64.2,-152.3],
 "PR":[18.22,-66.45],
 "GF":[3.93,-53.13]
};
function specialHit(ll){
 let found=null,bd=Infinity;
 [["AK",850000],["PR",100000],["GF",160000]].forEach(([iso,limit])=>{
  let p=SPECIAL[iso],d=map.distance(ll,L.latLng(p[0],p[1]));
  if(d<=limit&&d<bd){found=iso;bd=d}
 });
 return found?C.find(x=>x.iso2===found):null;
}
function addSpecial(){
 [["AK","Alaska","#3695c7",700000],["PR","Puerto Rico","#b3aa55",65000],["GF","Guayana Francesa","#d2a653",110000]].forEach(([iso,n,col,rad])=>{
  let p=SPECIAL[iso];
  L.circle(p,{radius:rad,color:"#4b5563",weight:1,fillColor:col,fillOpacity:.35,interactive:false}).addTo(map);
  L.tooltip({permanent:true,direction:"center",className:"country"}).setLatLng(p).setContent(n).addTo(map);
 });
}

const map=L.map("map",{minZoom:2,maxZoom:6,tap:false}).setView([12,-78],3);
function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function country(n){return C.find(c=>norm(c.mapName)==norm(n))}
function draw(){cardsEl.innerHTML="";cards.forEach(x=>{let e=document.createElement("div");e.className="card"+(places[x.id]?" placed":"");e.dataset.id=x.id;e.innerHTML=`<b>${x.k=="capital"?"🏛️":"✈️"} ${x.t}</b><small>${x.k=="capital"?"Capital":"Código IATA"}</small>`;bind(e);cardsEl.appendChild(e)});count.textContent=Object.keys(places).length;setTimeout(()=>{if(typeof updatePage==="function")updatePage()},0)}
function bind(e){e.onpointerdown=a=>{if(done)return;a.preventDefault();e.setPointerCapture(a.pointerId);let g=e.cloneNode(true);g.className="card ghost";g.style.left=a.clientX+"px";g.style.top=a.clientY+"px";document.body.appendChild(g);drag={e,g,id:e.dataset.id}};e.onpointermove=a=>{if(drag&&drag.e===e){drag.g.style.left=a.clientX+"px";drag.g.style.top=a.clientY+"px"}};e.onpointerup=drop;e.onpointercancel=drop}
function drop(e){if(!drag)return;let d=drag;d.g.remove();drag=null,r=map.getContainer().getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;let ll=map.containerPointToLatLng([e.clientX-r.left,e.clientY-r.top]),hit=null;for(let c of C){try{if(turf.booleanPointInPolygon([ll.lng,ll.lat],layers[c.mapName].toGeoJSON())){hit=c;break}}catch(_){}}if(!hit)hit=specialHit(ll);if(hit)place(d.id,hit.iso2)}
function place(id,iso){places[id]=iso;if(marks[id])map.removeLayer(marks[id]);let x=cards.find(q=>q.id==id),c=C.find(q=>q.iso2==iso),p=layers[c.mapName]?layers[c.mapName].getBounds().getCenter():L.latLng(SPECIAL[iso][0],SPECIAL[iso][1]),px=map.latLngToLayerPoint(p);px.y+=x.k=="capital"?9:-9;p=map.layerPointToLatLng(px);let m=L.marker(p,{icon:L.divIcon({className:"placedTag",html:`${x.k=="capital"?"🏛️":"✈️"} ${x.t}`,iconSize:null})}).addTo(map);m.on("click",()=>{if(!done){delete places[id];map.removeLayer(m);delete marks[id];draw()}});marks[id]=m;draw()}
function check(){done=true;let good=0;cards.forEach(x=>{let ok=places[x.id]===x.iso;if(ok)good++;let m=marks[x.id];if(m){let el=m.getElement();el.classList.add(ok?"ok":"bad")}});result.textContent=good+"/60";detail.textContent=`${good} correctas y ${60-good} incorrectas o sin colocar. Verde = correcta; rojo = incorrecta.`;modal.classList.add("show");draw()}
function reset(){Object.values(marks).forEach(m=>map.removeLayer(m));places={};marks={};done=false;modal.classList.remove("show");draw()}
checkBtn=document.getElementById("check");checkBtn.onclick=check;document.getElementById("clear").onclick=reset;
const cardsEl=document.getElementById("cards"),count=document.getElementById("count"),modal=document.getElementById("modal"),result=document.getElementById("result"),detail=document.getElementById("detail");
window.addEventListener("resize",()=>setTimeout(()=>map.invalidateSize(),120));

const cardStrip=document.getElementById("cards");
function cardStep(){
  const first=cardStrip.querySelector(".card");
  return first ? first.getBoundingClientRect().width+7 : 112;
}
function updatePage(){
  const max=Math.max(1,Math.ceil(cardStrip.scrollWidth/Math.max(1,cardStrip.clientWidth)));
  const page=Math.min(max,Math.floor(cardStrip.scrollLeft/Math.max(1,cardStrip.clientWidth))+1);
  document.getElementById("cardPage").textContent=page+"/"+max;
}
document.getElementById("prevCards").onclick=()=>{
  cardStrip.scrollBy({left:-cardStep()*3,behavior:"smooth"});
  setTimeout(updatePage,350);
};
document.getElementById("nextCards").onclick=()=>{
  cardStrip.scrollBy({left:cardStep()*3,behavior:"smooth"});
  setTimeout(updatePage,350);
};
cardStrip.addEventListener("scroll",()=>requestAnimationFrame(updatePage));
new ResizeObserver(()=>updatePage()).observe(cardStrip);

fetch(URL).then(r=>r.json()).then(g=>{let wanted=new Set(C.map(c=>c.mapName)),gl=L.geoJSON(g,{filter:f=>wanted.has(f.properties.ADMIN),style:f=>{let c=country(f.properties.ADMIN);return {fillColor:c?c.color:"#e5e7eb",color:"#4b5563",weight:1.1,fillOpacity:.92}},onEachFeature:(f,l)=>{let c=country(f.properties.ADMIN);if(c){layers[c.mapName]=l;l.bindTooltip(c.name,{permanent:true,direction:"center",className:"country"})}}}).addTo(map);map.fitBounds(gl.getBounds(),{padding:[15,15]});addSpecial();draw()});
</script></body></html>
