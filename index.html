<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>América - Capitales e IATA</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f7fb;color:#172033}header{padding:10px 14px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}header b{font-size:16px}.wrap{display:grid;grid-template-columns:1fr 320px;gap:10px;padding:10px}.box{background:#fff;border:1px solid #dfe5ec;border-radius:16px;overflow:hidden}.head{padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.head p{margin:2px 0;font-size:11px;color:#667085}.btn{padding:8px 11px;border:1px solid #dfe5ec;border-radius:9px;background:#fff;font-weight:700}.primary{background:#0f172a;color:white}#map{height:calc(100vh - 130px);min-height:500px;background:#b9def2}.tray{padding:10px;max-height:calc(100vh - 75px);overflow:auto}.cards{display:grid;gap:7px}.card{padding:9px;border:1px solid #dfe5ec;border-radius:10px;background:#fff;cursor:grab;touch-action:none;user-select:none}.card.placed{opacity:.35}.card b{font-size:12px}.card small{display:block;color:#667085}.ghost{position:fixed;z-index:9999;pointer-events:none;width:170px;transform:translate(-50%,-50%);box-shadow:0 8px 30px #0003}.country{background:#ffffffdd;border:0;font-weight:800;font-size:8px;padding:2px 3px}.country:before,.placedTag:before{display:none}.placedTag{background:white;border:1px solid #bbb;border-radius:6px;font-size:8px;font-weight:800;padding:3px 5px}.ok{background:#dcfce7!important;border-color:#22c55e!important}.bad{background:#fee2e2!important;border-color:#ef4444!important}.stats{font-size:12px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:10000;place-items:center;padding:20px}.modal.show{display:grid}.modal>div{background:#fff;padding:20px;border-radius:16px;max-width:400px;width:100%}.big{font-size:38px;font-weight:900}
@media(max-width:800px){.wrap{display:block;padding:6px}#map{height:55vh;min-height:360px}.tray{margin-top:7px;max-height:none}.cards{display:flex;overflow-x:auto}.card{min-width:145px}.country{font-size:6px}header{padding:8px}}

/* V4: interfaz móvil compacta */
@media(max-width:800px){
  body{overflow:hidden}
  header{
    height:46px;padding:5px 8px;
  }
  header>div:first-child>b{font-size:13px}
  header>div:first-child>div{display:none}
  .stats{font-size:10px;white-space:nowrap}
  .wrap{
    height:calc(100vh - 46px);
    display:flex;flex-direction:column;
    padding:4px;gap:4px;
  }
  .wrap>.box:first-child{
    flex:1;min-height:0;display:flex;flex-direction:column;
    border-radius:10px;
  }
  .head{
    min-height:39px;padding:4px 6px;flex:none;
  }
  .head>div:first-child>b{font-size:11px}
  .head p{display:none}
  .btn{
    padding:5px 7px;border-radius:7px;font-size:10px;
  }
  #map{
    flex:1;height:auto!important;min-height:0!important;
    border-radius:0 0 10px 10px;
  }
  .tray{
    flex:none;height:126px;max-height:126px!important;
    margin:0!important;padding:5px 6px;
    border-radius:10px;
    overflow:hidden;
  }
  .tray>b{font-size:10px}
  .tray>p{
    display:none;
  }
  .cards{
    display:flex!important;
    overflow-x:auto!important;overflow-y:hidden!important;
    gap:5px;margin-top:4px;padding-bottom:3px;
    scroll-snap-type:x proximity;
    scrollbar-width:thin;
  }
  .card{
    min-width:105px!important;
    width:105px;height:72px;
    padding:6px;border-radius:8px;
    display:flex;align-items:center;
    scroll-snap-align:start;
  }
  .card b{font-size:10px;line-height:1.15}
  .card small{font-size:8px;margin-top:2px}
  .ghost{width:120px!important;height:auto!important}
  .country{
    font-size:5.5px!important;
    line-height:1;padding:1px 2px!important;
    max-width:58px;text-align:center;
    white-space:normal;
  }
  .placedTag{
    font-size:6.5px!important;
    line-height:1;padding:2px 3px!important;
    max-width:72px;white-space:normal;text-align:center;
  }
  .leaflet-control-zoom a{
    width:26px!important;height:26px!important;line-height:26px!important;
  }
  .leaflet-control-attribution{
    font-size:7px!important;max-width:170px;
  }
  .modal>div{padding:14px;border-radius:13px}
  .big{font-size:32px}
}
@media(max-width:390px){
  header>div:first-child>b{font-size:12px}
  .tray{height:116px;max-height:116px!important}
  .card{min-width:96px!important;width:96px;height:65px}
  .country{font-size:5px!important}
  .placedTag{font-size:6px!important}
}

</style></head><body>
<header><div><b>🌎 América: Capitales e IATA</b><div style="font-size:10px;color:#667085">Coloca todas y corrige al final</div></div><div class="stats"><b id="count">0</b>/60 colocadas</div></header>
<div class="wrap"><section class="box"><div class="head"><div><b>Mapa de América</b><p>Los países están identificados. Puedes mover tus respuestas hasta pulsar Corregir.</p></div><div><button class="btn" id="clear">Limpiar</button> <button class="btn primary" id="check">Corregir</button></div></div><div id="map"></div></section>
<aside class="box tray"><b>📚 Listado completo</b><p style="font-size:11px;color:#667085">🏛️ Capitales y ✈️ códigos IATA</p><div class="cards" id="cards"></div></aside></div>
<div class="modal" id="modal"><div><b>Resultado final</b><div class="big" id="result"></div><p id="detail"></p><button class="btn" onclick="modal.classList.remove('show')">Revisar mapa</button> <button class="btn primary" onclick="reset()">Intentar de nuevo</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script>
const C=[{"mapName": "Canada", "name": "Canadá", "capital": "Ottawa", "iata": "YOW", "iso2": "CA"}, {"mapName": "United States of America", "name": "Estados Unidos", "capital": "Washington D. C.", "iata": "DCA", "iso2": "US"}, {"mapName": "Mexico", "name": "México", "capital": "Ciudad de México", "iata": "MEX", "iso2": "MX"}, {"mapName": "Guatemala", "name": "Guatemala", "capital": "Ciudad de Guatemala", "iata": "GUA", "iso2": "GT"}, {"mapName": "Belize", "name": "Belice", "capital": "Belmopán", "iata": "BZE", "iso2": "BZ"}, {"mapName": "Honduras", "name": "Honduras", "capital": "Tegucigalpa", "iata": "TGU", "iso2": "HN"}, {"mapName": "El Salvador", "name": "El Salvador", "capital": "San Salvador", "iata": "SAL", "iso2": "SV"}, {"mapName": "Nicaragua", "name": "Nicaragua", "capital": "Managua", "iata": "MGA", "iso2": "NI"}, {"mapName": "Costa Rica", "name": "Costa Rica", "capital": "San José", "iata": "SJO", "iso2": "CR"}, {"mapName": "Panama", "name": "Panamá", "capital": "Ciudad de Panamá", "iata": "PTY", "iso2": "PA"}, {"mapName": "Cuba", "name": "Cuba", "capital": "La Habana", "iata": "HAV", "iso2": "CU"}, {"mapName": "Jamaica", "name": "Jamaica", "capital": "Kingston", "iata": "KIN", "iso2": "JM"}, {"mapName": "Haiti", "name": "Haití", "capital": "Puerto Príncipe", "iata": "PAP", "iso2": "HT"}, {"mapName": "Dominican Republic", "name": "República Dominicana", "capital": "Santo Domingo", "iata": "SDQ", "iso2": "DO"}, {"mapName": "The Bahamas", "name": "Bahamas", "capital": "Nassau", "iata": "NAS", "iso2": "BS"}, {"mapName": "Barbados", "name": "Barbados", "capital": "Bridgetown", "iata": "BGI", "iso2": "BB"}, {"mapName": "Trinidad and Tobago", "name": "Trinidad y Tobago", "capital": "Puerto España", "iata": "POS", "iso2": "TT"}, {"mapName": "Grenada", "name": "Granada", "capital": "Saint George's", "iata": "GND", "iso2": "GD"}, {"mapName": "Colombia", "name": "Colombia", "capital": "Bogotá", "iata": "BOG", "iso2": "CO"}, {"mapName": "Venezuela", "name": "Venezuela", "capital": "Caracas", "iata": "CCS", "iso2": "VE"}, {"mapName": "Guyana", "name": "Guyana", "capital": "Georgetown", "iata": "GEO", "iso2": "GY"}, {"mapName": "Suriname", "name": "Surinam", "capital": "Paramaribo", "iata": "PBM", "iso2": "SR"}, {"mapName": "Ecuador", "name": "Ecuador", "capital": "Quito", "iata": "UIO", "iso2": "EC"}, {"mapName": "Peru", "name": "Perú", "capital": "Lima", "iata": "LIM", "iso2": "PE"}, {"mapName": "Bolivia", "name": "Bolivia", "capital": "Sucre", "iata": "SRE", "iso2": "BO"}, {"mapName": "Chile", "name": "Chile", "capital": "Santiago", "iata": "SCL", "iso2": "CL"}, {"mapName": "Argentina", "name": "Argentina", "capital": "Buenos Aires", "iata": "AEP", "iso2": "AR"}, {"mapName": "Paraguay", "name": "Paraguay", "capital": "Asunción", "iata": "ASU", "iso2": "PY"}, {"mapName": "Uruguay", "name": "Uruguay", "capital": "Montevideo", "iata": "MVD", "iso2": "UY"}, {"mapName": "Brazil", "name": "Brasil", "capital": "Brasília", "iata": "BSB", "iso2": "BR"}],URL="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson";
const cards=[];C.forEach(c=>{cards.push({id:c.iso2+"c",iso:c.iso2,k:"capital",t:c.capital});cards.push({id:c.iso2+"i",iso:c.iso2,k:"iata",t:c.iata})});
let layers={},places={},marks={},drag=null,done=false;
const map=L.map("map",{minZoom:2,maxZoom:6,tap:false}).setView([12,-78],3);
function norm(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function country(n){return C.find(c=>norm(c.mapName)==norm(n))}
function draw(){cardsEl.innerHTML="";cards.forEach(x=>{let e=document.createElement("div");e.className="card"+(places[x.id]?" placed":"");e.dataset.id=x.id;e.innerHTML=`<b>${x.k=="capital"?"🏛️":"✈️"} ${x.t}</b><small>${x.k=="capital"?"Capital":"Código IATA"}</small>`;bind(e);cardsEl.appendChild(e)});count.textContent=Object.keys(places).length}
function bind(e){e.onpointerdown=a=>{if(done)return;a.preventDefault();e.setPointerCapture(a.pointerId);let g=e.cloneNode(true);g.className="card ghost";g.style.left=a.clientX+"px";g.style.top=a.clientY+"px";document.body.appendChild(g);drag={e,g,id:e.dataset.id}};e.onpointermove=a=>{if(drag&&drag.e===e){drag.g.style.left=a.clientX+"px";drag.g.style.top=a.clientY+"px"}};e.onpointerup=drop;e.onpointercancel=drop}
function drop(e){if(!drag)return;let d=drag;d.g.remove();drag=null,r=map.getContainer().getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;let ll=map.containerPointToLatLng([e.clientX-r.left,e.clientY-r.top]),hit=null;for(let c of C){try{if(turf.booleanPointInPolygon([ll.lng,ll.lat],layers[c.mapName].toGeoJSON())){hit=c;break}}catch(_){}}if(hit)place(d.id,hit.iso2)}
function place(id,iso){places[id]=iso;if(marks[id])map.removeLayer(marks[id]);let x=cards.find(q=>q.id==id),c=C.find(q=>q.iso2==iso),p=layers[c.mapName].getBounds().getCenter(),px=map.latLngToLayerPoint(p);px.y+=x.k=="capital"?9:-9;p=map.layerPointToLatLng(px);let m=L.marker(p,{icon:L.divIcon({className:"placedTag",html:`${x.k=="capital"?"🏛️":"✈️"} ${x.t}`,iconSize:null})}).addTo(map);m.on("click",()=>{if(!done){delete places[id];map.removeLayer(m);delete marks[id];draw()}});marks[id]=m;draw()}
function check(){done=true;let good=0;cards.forEach(x=>{let ok=places[x.id]===x.iso;if(ok)good++;let m=marks[x.id];if(m){let el=m.getElement();el.classList.add(ok?"ok":"bad")}});result.textContent=good+"/60";detail.textContent=`${good} correctas y ${60-good} incorrectas o sin colocar. Verde = correcta; rojo = incorrecta.`;modal.classList.add("show");draw()}
function reset(){Object.values(marks).forEach(m=>map.removeLayer(m));places={};marks={};done=false;modal.classList.remove("show");draw()}
checkBtn=document.getElementById("check");checkBtn.onclick=check;document.getElementById("clear").onclick=reset;
const cardsEl=document.getElementById("cards"),count=document.getElementById("count"),modal=document.getElementById("modal"),result=document.getElementById("result"),detail=document.getElementById("detail");
window.addEventListener("resize",()=>setTimeout(()=>map.invalidateSize(),120));
fetch(URL).then(r=>r.json()).then(g=>{let wanted=new Set(C.map(c=>c.mapName)),gl=L.geoJSON(g,{filter:f=>wanted.has(f.properties.ADMIN),style:{fillColor:"#dbeafe",color:"#64748b",weight:1,fillOpacity:.9},onEachFeature:(f,l)=>{let c=country(f.properties.ADMIN);if(c){layers[c.mapName]=l;l.bindTooltip(c.name,{permanent:true,direction:"center",className:"country"})}}}).addTo(map);map.fitBounds(gl.getBounds(),{padding:[15,15]});draw()});
</script></body></html>
